plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Signing: ONE dedicated key for debug AND release (design spec 4.7), so an
// upgrade never needs an uninstall. The key lives outside the repo; its path
// and passwords come from android/local.properties (gitignored) or the
// environment. If any value is missing the package tasks FAIL: AGP would
// otherwise silently fall back to the shared default debug key.
def localProps = new Properties()
rootProject.file('local.properties').with { if (it.exists()) it.withInputStream { s -> localProps.load(s) } }
def signingValue = { String name -> localProps.getProperty(name) ?: System.getenv(name) }
def ksPath = signingValue('AETHER_KEYSTORE_PATH')
def ksPassword = signingValue('AETHER_KEYSTORE_PASSWORD')
def ksAlias = signingValue('AETHER_KEY_ALIAS')
def ksKeyPassword = signingValue('AETHER_KEY_PASSWORD')
def hasAetherSigning = ksPath && ksPassword && ksAlias && ksKeyPassword && new File(ksPath).exists()

// Titan's tailnet IPv4, baked at build time (design spec 4.5). Precedence: -P /
// ~/.gradle/gradle.properties, then local.properties, then the environment. It
// is the ONLY host the app may dial in cleartext, so it must sit in the
// Tailscale CGNAT range 100.64.0.0/10 or the build fails.
def titanIp = (project.findProperty('AETHER_TITAN_TAILNET_IP') ?: signingValue('AETHER_TITAN_TAILNET_IP') ?: '').toString().trim()
if (titanIp && !(titanIp ==~ /^100\.(6[4-9]|[7-9]\d|1[01]\d|12[0-7])\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)$/)) {
    throw new GradleException(
        "AETHER_TITAN_TAILNET_IP is not a Tailscale address (expected 100.64.0.0/10, e.g. 100.x.y.z). " +
        "Fix the value in -P, ~/.gradle/gradle.properties, android/local.properties or the environment.")
}

// Writes res/xml/network_security_config.xml into a build-generated resource
// directory: cleartext forbidden everywhere, plus one domain-config for titan
// when the IP is set.
abstract class GenerateNetworkSecurityConfig extends DefaultTask {
    @Input abstract Property<String> getTitanIp()
    @OutputDirectory abstract DirectoryProperty getOutputDir()

    @TaskAction
    void generate() {
        def ip = titanIp.get()
        def domain = ip ? '''
    <domain-config cleartextTrafficPermitted="true">
        <domain includeSubdomains="false">''' + ip + '''</domain>
    </domain-config>''' : ''
        def dir = new File(outputDir.get().asFile, 'xml')
        dir.mkdirs()
        new File(dir, 'network_security_config.xml').setText(
            '<?xml version="1.0" encoding="utf-8"?>\n' +
            '<!-- GENERATED by :app generate*NetworkSecurityConfig. Do not edit. -->\n' +
            '<network-security-config>\n' +
            '    <base-config cleartextTrafficPermitted="false">\n' +
            '        <trust-anchors>\n' +
            '            <certificates src="system" />\n' +
            '        </trust-anchors>\n' +
            '    </base-config>' + domain + '\n' +
            '</network-security-config>\n', 'UTF-8')
    }
}

android {
    namespace 'com.matt.aethermobile'
    compileSdk 35

    defaultConfig {
        applicationId "com.matt.aethermobile"
        minSdk 31
        targetSdk 35
        versionCode 2
        versionName "0.2.0-v1"
        buildConfigField 'String', 'TITAN_IP', "\"${titanIp}\""
    }

    signingConfigs {
        if (hasAetherSigning) {
            aether {
                storeFile new File(ksPath)
                storePassword ksPassword
                keyAlias ksAlias
                keyPassword ksKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            if (hasAetherSigning) signingConfig signingConfigs.aether
        }
        release {
            if (hasAetherSigning) signingConfig signingConfigs.aether
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    // Terminal assets are served as-is by WebViewAssetLoader.
    androidResources {
        noCompress 'js', 'css', 'html'
    }
    buildFeatures {
        buildConfig true
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def gen = tasks.register("generate${variant.name.capitalize()}NetworkSecurityConfig", GenerateNetworkSecurityConfig) {
            it.titanIp.set(titanIp)
        }
        variant.sources.res.addGeneratedSourceDirectory(gen, { it.outputDir })
    }
}

tasks.register('verifyAetherTitanIp') {
    doFirst {
        if (!titanIp) {
            throw new GradleException(
                "AETHER_TITAN_TAILNET_IP is not set. Release packaging needs titan's tailnet IP baked in: " +
                "pass -PAETHER_TITAN_TAILNET_IP=100.x.y.z or set it in android/local.properties " +
                "(gitignored), ~/.gradle/gradle.properties or the environment.")
        }
    }
}

tasks.register('verifyAetherSigning') {
    doFirst {
        if (!hasAetherSigning) {
            throw new GradleException(
                "Aether Mobile signing is not configured. Set AETHER_KEYSTORE_PATH, AETHER_KEYSTORE_PASSWORD, " +
                "AETHER_KEY_ALIAS and AETHER_KEY_PASSWORD in android/local.properties (gitignored) or the " +
                "environment, pointing at the dedicated keystore outside the repo. Refusing to fall back to " +
                "the default debug key.")
        }
    }
}
// Generic rule: every package*, sign* and bundle<Variant> task (APK or AAB, any variant)
// needs the guard, so no packaging path can sign with the default debug key.
tasks.configureEach { t ->
    def n = t.name
    def intermediate = n ==~ /.*(Classes|Resources|Aar|Jar|Metadata|Libs|Mapping).*/ // compile/test plumbing, not signing
    if (n != 'verifyAetherSigning' && !intermediate && n ==~ /^(package|sign|bundle)[A-Z]\w*/) {
        t.dependsOn 'verifyAetherSigning'
        if (n.contains('Release')) t.dependsOn 'verifyAetherTitanIp'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    // WebViewAssetLoader + addWebMessageListener
    implementation 'androidx.webkit:webkit:1.12.1'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    // Real org.json for JVM unit tests (Android's jar is stubs that throw)
    testImplementation 'org.json:json:20231013'
}
