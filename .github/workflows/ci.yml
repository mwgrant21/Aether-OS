name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Least privilege for GITHUB_TOKEN: every job here only reads the repository.
# Flagged by CodeQL on PR #46 ("Workflow does not contain permissions").
permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      # electron/ has its own tsconfig that neither `tsc -b` (root project
      # references stop at src/) nor electron-vite (esbuild strips types
      # without checking them) ever evaluates. Without this step the whole
      # main process ships untyped; it had accumulated 15 errors unnoticed.
      - run: npm run typecheck:electron
      - run: npm run build

  # collector/ is a standalone package (own package.json, lockfile, tsc
  # build and vitest config) that the root `npm test` deliberately excludes,
  # with a comment deferring to "collector's own test command". Nothing in CI
  # ever ran that command: 29 collector test files plus the two hook tests
  # under scripts/ (which collector/vitest.config.ts owns) could go red while
  # every job stayed green. The daemon this package builds is the one that
  # ingests hook events, so this is not a peripheral suite.
  #
  # Same Node matrix as test-and-build: the collector needs node:sqlite
  # (Node >= 22.5), and the version a user's autostart task runs under is
  # whatever is on PATH, so both supported majors are exercised.
  collector:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: collector/package-lock.json
      - run: npm ci
        working-directory: collector
      - run: npm run build
        working-directory: collector
      - run: npm test
        working-directory: collector

  go-collector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      # -race, because the collector is concurrent by construction: the spool
      # tail, transcript scan and fleet poll loops all run against one shared
      # database and one shared logger. Without it, a data race in this package
      # is invisible to CI and only ever shows up as a flake.
      #
      # It has already earned its place. The fleet-heartbeat test read a
      # bytes.Buffer from the test goroutine while a collector loop logged into
      # it -- log.SetOutput serialises writers behind the log package's mutex,
      # but a reader takes no part in that lock. It went unnoticed because the
      # only signal it ever produced was an intermittent failure of a DIFFERENT
      # assertion (CI run 34071254746), which blocked an unrelated PR.
      #
      # -race requires cgo, which is why CGO_ENABLED is set explicitly rather
      # than left to the default: this repo's sqlite driver is modernc.org's
      # pure-Go one, so nothing here would otherwise need a C toolchain, and a
      # future runner or GOFLAGS change that turns cgo off must fail loudly on
      # the missing compiler rather than silently drop the detector.
      # GOOS=windows compile-checks linkcount_windows.go, which no lane would
      # otherwise build: this job is ubuntu-only and windows-build runs no Go.
      # That file exists so the Go collector is not blind to NTFS hard links on
      # the platform the app actually ships on, so leaving it unbuilt in CI
      # would be the one place a break could land unseen.
      - run: go build ./... && GOOS=windows go build ./... && go vet ./... && CGO_ENABLED=1 go test -race ./...
        working-directory: collector-go

  # Windows is the platform this app actually runs on, and the one carrying
  # every failure mode Linux CI structurally cannot see: Electron/AppContainer
  # ACL setup, node-pty prebuilds, Windows path and shell semantics, the
  # Electron binary install sequence, and archive-tool differences.
  #
  # This lane is not decoration and must never be marked continue-on-error.
  # It has already earned its place: `snapshotBuilder.ts` passed
  # GNU-only `tar --force-local`, which System32's bsdtar rejects outright
  # ("Option --force-local is not supported", exit 1). Every Linux job was
  # green while cross-engine snapshot creation was broken on the target
  # platform. Reverting that fix turns this job's 6 snapshotBuilder tests red.
  #
  # A single Node version, deliberately: the point is platform coverage, not a
  # second version matrix. 24.x matches the newest entry in the Linux matrix so
  # a failure here is attributable to the OS rather than to the runtime.
  #
  # No credentials are present and none are needed. The cross-engine provider
  # suite runs entirely against the fake stdio providers in
  # electron/crossEngine/providers/, so protocol, lifecycle, cancellation and
  # permission-denial behaviour are all exercised without a Codex or Claude
  # login. Do not add secrets to this job.
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      # postinstall runs `install-electron && node scripts/grant-appcontainer-acl.js`.
      # The ACL script is safe unelevated: it exits 0 when electron/dist is
      # absent and catches icacls failures with a warning rather than failing
      # the install (see that script's own comments).
      - run: npm ci

      - run: npm test
      - run: npm run typecheck:electron
      - run: npm run build
      - run: npm run electron:build

      # electron-vite exits 0 on a partially-populated out/, which presents at
      # runtime as a blank window rather than an error -- so assert the trees
      # and the native/binary dependencies explicitly.
      - name: Verify Electron artifacts and native modules
        run: node scripts/verify-electron-artifacts.mjs

      # The collector daemon runs on Windows via a logon scheduled task; its
      # suite has Windows-path and hook-spawn cases the Linux job cannot see.
      - run: npm ci
        working-directory: collector
      - run: npm run build
        working-directory: collector
      - run: npm test
        working-directory: collector

  # Playwright e2e (e2e/*.spec.ts) drives the BUILT Electron app (out/main/main.js,
  # via _electron.launch in e2e/electronHelpers.ts), so it needs the electron-vite
  # build, the Electron binary and a desktop session. electronHelpers.launchApp
  # throws on non-win32, so this is Windows-only; there is no xvfb/Linux path.
  # Nothing ever ran these specs in CI (npm run test:e2e was only a local script),
  # so the CI-only `--disable-gpu` branch in electronHelpers.ts was dead code.
  #
  # Only the hard-fail subset (8 tests: 5 CSP + 3 app smoke) is proven to run on
  # windows-latest. Three app.spec.ts tests (real pty output, Codex terminal, dashboard
  # real-usage metrics) are informational because they need a real claude/codex
  # install, a real PTY fixture or local usage data that hosted runners lack.
  #
  # Deliberately a SEPARATE job, not a step in windows-build: windows-build is a
  # required check and must stay deterministic. This job is not required (see
  # branch protection); promote it only after it has been green across several runs.
  e2e-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - run: npm run electron:build
      # Hard-fail set: the 8 app + CSP tests proven to run on windows-latest.
      # Three app.spec.ts tests are excluded here (see header): they need local state.
      - name: E2E smoke (app + CSP, runner-proven)
        run: npx playwright test e2e/app.spec.ts e2e/csp.spec.ts --grep-invert "embedded terminal spawns a real pty|Codex terminal delivers real output|dashboard metrics row renders real-usage"
      # Informational: the 3 app.spec.ts tests above. They need a real claude/codex
      # install, a real PTY fixture or local usage data that hosted runners lack.
      - name: E2E needs-local-state specs (informational)
        continue-on-error: true
        run: npx playwright test e2e/app.spec.ts --grep "embedded terminal spawns a real pty|Codex terminal delivers real output|dashboard metrics row renders real-usage"
      # Informational: native UI-Automation / csc.exe / clipboard / two-instance specs.
      # Behaviour on a hosted runner is unproven, so this step is continue-on-error
      # until a few runs show whether it is stable; then drop continue-on-error or
      # delete the specs it cannot run.
      - name: E2E native specs (informational)
        continue-on-error: true
        run: npx playwright test --grep-invert "Aether OS smoke|Renderer CSP"
      # Non-fatal: copies only the app's diag.log* (never whole temp roots, which hold a
      # permission-server secret) so a close hang can be diagnosed from the artifact.
      - name: Collect e2e diag logs
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path e2e-diag | Out-Null
          foreach ($root in (Get-ChildItem -Path $env:TEMP -Directory -Filter 'aether-e2e-*' -ErrorAction SilentlyContinue)) {
            foreach ($f in (Get-ChildItem -Path $root.FullName -Recurse -File -Filter 'diag.log*' -ErrorAction SilentlyContinue)) {
              # upload-artifact@v4 skips dot-prefixed path segments (.aether-os), so strip leading dots.
              $segs = $f.FullName.Substring($root.FullName.Length).TrimStart('\', '/') -split '[\\/]'
              $rel = ($segs | ForEach-Object { $_.TrimStart('.') }) -join '\'
              $dest = Join-Path (Join-Path 'e2e-diag' $root.Name) $rel
              # '.aether-os' and 'aether-os' would now map to one path: never overwrite, suffix instead.
              $n = 0
              while (Test-Path -LiteralPath $dest) { $n++; $dest = (Join-Path (Join-Path 'e2e-diag' $root.Name) $rel) + ".dup$n" }
              New-Item -ItemType Directory -Force -Path (Split-Path $dest -Parent) | Out-Null
              Copy-Item -LiteralPath $f.FullName -Destination $dest -ErrorAction Continue
            }
          }
          exit 0
      - name: Upload e2e output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: |
            test-results/
            e2e-diag/
          if-no-files-found: ignore
          retention-days: 7
